name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon
          POSTGRES_DB: recon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://recon:recon@localhost:5432/recon?schema=public
      MOCK_PROVIDER_URL: http://localhost:4000
      MOCK_PROVIDER_WEBHOOK_SECRET: whsec_ci_test_secret_do_not_use_0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install mock-provider dependencies
        run: npm ci --prefix mock-provider

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Unit and integration tests
        run: npm test

      - name: Python CLI tests
        run: python -m unittest discover -s tests -v
        working-directory: python-cli

      - name: npm audit
        run: npm audit --audit-level=high

      - name: npm audit (mock-provider)
        run: npm audit --audit-level=high --prefix mock-provider

      - name: Secret scan
        run: npm run secret-scan

      - name: Docker build (app)
        run: docker build -f Dockerfile -t recon-app:ci .

      - name: Docker build (mock provider)
        run: docker build -f mock-provider/Dockerfile -t recon-mock-provider:ci .

      - name: Docker Compose smoke test
        run: |
          set -e
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

          echo "Waiting for the app to become healthy..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3005/api/health >/dev/null 2>&1; then
              echo "app is healthy"
              break
            fi
            sleep 2
          done

          echo "Waiting for the mock provider to become healthy..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
              echo "mock provider is healthy"
              break
            fi
            sleep 2
          done

          echo "Running the real demo inside the app container (asserts every scenario's expected findings and the incomplete-export -> INCONCLUSIVE behavior; a non-zero exit here fails this step)..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T app npx tsx scripts/demo.ts

      - name: Collect Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > docker-compose-smoke.log || true

      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-smoke-logs
          path: docker-compose-smoke.log

      - name: Docker Compose cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
