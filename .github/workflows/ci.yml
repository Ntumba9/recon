name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon
          POSTGRES_DB: recon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://recon:recon@localhost:5432/recon?schema=public
      MOCK_PROVIDER_URL: http://localhost:4000
      MOCK_PROVIDER_WEBHOOK_SECRET: whsec_ci_test_secret_do_not_use_0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install mock-provider dependencies
        run: npm ci --prefix mock-provider

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Unit and integration tests
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: npm run secret-scan

      - name: Docker build (app)
        run: docker build -f Dockerfile -t recon-app:ci .

      - name: Docker build (mock provider)
        run: docker build -f mock-provider/Dockerfile -t recon-mock-provider:ci .
